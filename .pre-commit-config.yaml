repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: mypy-gateway
        name: mypy (gateway)
        entry: uv run mypy services/gateway/app services/gateway/main.py
        language: system
        files: ^services/gateway/
        pass_filenames: false

      - id: eslint-frontend
        name: eslint (frontend)
        entry: pnpm --filter frontend lint
        language: system
        files: ^apps/frontend/
        pass_filenames: false

      - id: prettier-frontend
        name: prettier (frontend)
        entry: pnpm --filter frontend format
        language: system
        files: ^apps/frontend/
        pass_filenames: false

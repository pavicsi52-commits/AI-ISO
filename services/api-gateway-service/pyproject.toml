[project]
name = "api-gateway-service"
version = "0.1.0"
description = "AI-IOS Enterprise API Gateway Service — reverse proxy, routing, authentication, authorization, rate limiting, quotas, load balancing, service discovery, request/response transformation, versioning, a GraphQL gateway, a WebSocket gateway, and OpenAPI aggregation for every AI-IOS service"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  "websockets>=13.0",
  "strawberry-graphql[fastapi]>=0.243.0",
  "shared-core",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-httpx>=0.35.0",
]

[tool.uv]
package = false

[tool.uv.sources]
shared-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
  "error",
  # Same confirmed environment/timing artifact documented in every prior
  # AI-IOS service's own conftest: on Windows' ProactorEventLoop, an
  # asyncpg connection properly disposed at one test's teardown is
  # sometimes only garbage-collected during a later, unrelated test whose
  # event loop is already closed, so asyncpg's __del__ raises an
  # unraisable ResourceWarning pytest turns into that later test's own
  # failure. Not a connection leak in this service's own code.
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "def __repr__",
]

[project]
name = "gateway"
version = "0.1.0"
description = "AI-IOS API Gateway — platform entry point (routing, auth, rate limiting, foundation)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "shared-core",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx2>=2.7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
shared-core = { workspace = true }

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

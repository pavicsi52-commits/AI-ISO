[project]
name = "shared-core"
version = "0.1.0"
description = "AI-IOS Enterprise Shared Core Framework — the reusable foundation every microservice depends on"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "fastapi>=0.115.0",
  "starlette>=0.40.0",
  "argon2-cffi>=23.1.0",
  "pyjwt[crypto]>=2.10.0",
  "cryptography>=43.0.0",
  "redis>=5.2.0",
  "aio-pika>=9.5.0",
  "minio>=7.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "prometheus-client>=0.21.0",
  "msgpack>=1.1.0",
  "zstandard>=0.23.0",
  "croniter>=5.0.0",
  "psutil>=6.0.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "aiosmtplib>=3.0.0",
  "markdown>=3.7",
  "pyyaml>=6.0.2",
  "packaging>=24.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "fakeredis>=2.26.0",
  "freezegun>=1.5.0",
  "aiosqlite>=0.20.0",
  "types-croniter>=5.0.0",
  "types-psutil>=6.0.0",
  "types-markdown>=3.7",
  "types-pyyaml>=6.0.12",
  "aiosmtpd>=1.4.6",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "shared_core"

[build-system]
requires = ["uv_build>=0.6,<0.7"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src/shared_core"]

[tool.coverage.report]
fail_under = 95
show_missing = true

apiVersion: v1
kind: Secret
metadata:
  name: ai-ios-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ai-ios.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIIOS_JWT_PRIVATE_KEY: {{ .Values.secrets.jwtPrivateKey | quote }}
  AIIOS_JWT_PUBLIC_KEY: {{ .Values.secrets.jwtPublicKey | quote }}

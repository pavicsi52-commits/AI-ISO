{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ai-ios-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ai-ios.componentLabels" (dict "component" "frontend" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
{{- end }}
